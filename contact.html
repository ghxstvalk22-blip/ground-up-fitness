<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | Ground Up Fitness</title>
    <meta name="description" content="Stuck on where to start, or have a question about a plan? Send a note. I usually reply within two days.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="exercises.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body data-page="contact">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"><noscript><nav class="noscript-nav"><a href="index.html">Home</a> <a href="start.html">Start here</a> <a href="programs.html">Programs</a> <a href="pros.html">Pros</a> <a href="tools.html">Tools</a> <a href="basics.html">Gym basics</a> <a href="contact.html">Contact</a></nav></noscript></div>

<header class="page-banner">
    <div class="page-banner-inner">
        <p class="eyebrow">Talk to a real person</p>
        <h1>Contact</h1>
        <p class="page-banner-lede">Stuck on where to start, or have a question about a plan? Send a note. I usually reply within two days.</p>
    </div>
</header>

<main id="main">
    <section id="contact" class="block">
        <div class="container narrow">

            <form id="contact-form" novalidate>
                <div class="field-row">
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" name="name" autocomplete="name" required>
                        <p class="error" id="name-error"></p>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                        <p class="error" id="email-error"></p>
                    </div>
                </div>
                <div class="field">
                    <label for="topic">What is it about?</label>
                    <select id="topic" name="topic">
                        <option value="general">General question</option>
                        <option value="beginner">Getting started</option>
                        <option value="program">A training program</option>
                        <option value="fatloss">Losing weight</option>
                        <option value="strength">Getting stronger</option>
                        <option value="nutrition">Food and nutrition</option>
                    </select>
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" maxlength="500" required></textarea>
                    <div class="field-foot">
                        <p class="error" id="message-error"></p>
                        <p class="counter" id="message-count">0 / 500</p>
                    </div>
                </div>

                <!-- Hidden trap for spam bots. People never see or fill this. -->
                <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit" id="send-btn">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="btn-label">Send message</span>
                    </button>
                    <p class="draft-note" id="draft-note"></p>
                </div>
                <p class="form-status" id="form-status" role="status"></p>
            </form>

            <div class="sent" id="sent" tabindex="-1" hidden>
                <svg class="sent-check" viewBox="0 0 52 52" aria-hidden="true">
                    <circle cx="26" cy="26" r="23" pathLength="1"/>
                    <path d="M15 27 l8 8 l15 -17" pathLength="1"/>
                </svg>
                <div>
                    <h3 id="sent-title">Message sent</h3>
                    <p id="sent-detail"></p>
                    <button class="btn btn-small" type="button" id="send-another">Send another message</button>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="site-footer"></div>
</body>
</html>
